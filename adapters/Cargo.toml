[package]
name = "adapters"
version = "0.1.0"
edition = "2024"

[dependencies]
kernel = { path = "../kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
futures-util = "0.3"
anyhow       = "1"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest           = { version = "0.12", features = ["json"] }
chrono = "0.4"

