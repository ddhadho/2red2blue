[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
kernel = { path = "../kernel" }
adapters = { path = "../adapters" }
platform = { path = "../platform" }
ui = { path = "../ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"