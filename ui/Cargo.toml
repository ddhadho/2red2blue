[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
kernel = { path = "../kernel" }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
ulid = "1"
toml = "0.8"
