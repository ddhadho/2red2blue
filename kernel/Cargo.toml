[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
ulid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"